# ------------------------------------------------------------------ Cloudflare Workers AI
# Billed in neurons: 0.011 USD per 1,000 neurons, first 10,000 neurons per day free (resets 00:00 UTC).
# usd_per_minute = neurons_per_minute * 0.011 / 1000 (list price, free allocation ignored).
# Data policy, all Workers AI models: https://developers.cloudflare.com/workers-ai/platform/data-usage/
# "does not use Customer Content processed by Workers AI to train AI models"; inputs and outputs are
# not retained after they are no longer needed (no AI Gateway logging is used). Operational metadata only.
# Rate limit: 720 requests per minute for Automatic Speech Recognition (platform/limits/).

[cf-whisper-large-v3-turbo]
model_id = "@cf/openai/whisper-large-v3-turbo"
usd_per_minute = 0.00051293       # 46.63 neurons per audio minute; 0.0308 USD per hour
neurons_per_minute = 46.63
usd_per_1k_neurons = 0.011
min_billed_seconds = 0            # none stated
checked_url = "https://developers.cloudflare.com/workers-ai/platform/pricing/"
checked_on = "2026-10-19"
data_policy = "Cloudflare does not train on Workers AI inputs and does not retain them after the request (https://developers.cloudflare.com/workers-ai/platform/data-usage/)"
opt_out = "not needed; no AI Gateway logging is used"
# policy fields from data_policy above; a missing key means unknown (exported as null)
retention_days = 0
trains_by_default = false
opt_out_status = "not_needed"   # applied | not_offered | not_needed
policy_url = "https://developers.cloudflare.com/workers-ai/platform/data-usage/"
notes = "Base64 JSON input with language and task=transcribe; word timings in segments[].words. Model page lists 0.000513 per audio minute. Files longer than chunk_seconds (240) are split into WAV chunks."

