trains_by_default = false
opt_out_status = "not_needed"   # applied | not_offered | not_needed
policy_url = "https://ai.google.dev/gemini-api/terms"
notes = "Prices for 3.8 Flash double on 2027-01-01 (1.50 input, 7.50 output per M). Thinking cannot be disabled on 3.8 Flash; adapter uses thinkingLevel=low. Audio tokens: https://ai.google.dev/gemini-api/docs/audio"
