# `models` overrides usd_per_minute per model id. Re-check before publishing results.
#
# Verification (docs/providers.md, "Verification status"), on every section:
#   live_verified  true only after a real call confirmed the request and response shapes
#   price_status   "documented" (read from an official page, see checked_url / checked_on) or "unverified"
#   policy_status  "documented" (data use and training established from an official page), "unverified"
#                  (stated, but the source does not cover this product) or "unknown" (not stated)
#   unverified     open questions to settle on the first live run
# Free and local systems use "not_applicable". A real run refuses a paid provider whose price is missing
# or not documented, or whose policy is not documented, unless it is named in --allow-unverified
# (clipbench/providers/verification.py).

