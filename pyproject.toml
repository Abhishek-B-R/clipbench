[project]
name = "clipbench"
version = "0.1.0"
description = "A speech-to-text benchmark on real short-form social video."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
dependencies = [
  "typer>=0.12",
  "pydantic>=2.7",
  "httpx>=0.27",
  "jiwer>=3.0",
  "pandas>=2.2",
  "pyarrow>=16",
  "numpy>=1.26",
  "fugashi>=1.3",
  "unidic-lite>=1.0.8",
  "pykakasi>=2.3",
  "altair>=5.3",
  "vl-convert-python>=1.6",
  "fastapi>=0.111",
  "uvicorn>=0.30",
  "python-dotenv>=1.0",
  "rich>=13.7",
  "tenacity>=8.3",
  "soundfile>=0.12",
  "websockets>=17.2",
]

[project.optional-dependencies]
local = [
  "mlx-whisper>=0.4; platform_machine == 'arm64' and sys_platform == 'darwin'",
  "faster-whisper>=1.0",
]
aws = ["boto3>=1.34"]
# clipbench align: CTC forced alignment with the MMS 300m forced aligner model (weights download on first use)
align = ["torch>=2.4", "transformers>=4.44", "uroman>=1.3"]

[project.scripts]
clipbench = "clipbench.cli:app"

[dependency-groups]
dev = ["pytest>=8.2", "pytest-asyncio>=0.23", "ruff>=0.5"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["clipbench"]

[tool.hatch.build.targets.wheel.force-include]
"clipbench/providers/pricing.toml" = "clipbench/providers/pricing.toml"

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501", "B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
