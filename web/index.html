<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>clipbench: Which speech-to-text should your video app use?</title>
    <meta name="description" content="The independent benchmark for captions on real short-form video: accuracy, word timing, hallucination over music, and cost." />
    <meta name="theme-color" content="#faf9f6" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#141413" media="(prefers-color-scheme: dark)" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon-32.png" type="image/png" sizes="32x32" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta property="og:title" content="clipbench" />
    <meta property="og:description" content="The independent benchmark for captions on real short-form video: accuracy, word timing, hallucination over music, and cost." />
    <script>
      // Apply the saved theme before first paint (see src/lib/theme.ts).
      (function () {
        try {
          var p = localStorage.getItem("clipbench-theme");
          var dark = p === "dark" || (p !== "light" && window.matchMedia("(prefers-color-scheme: dark)").matches);
          document.documentElement.dataset.theme = dark ? "dark" : "light";
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>clipbench needs JavaScript for this view. The static report is in the repository under site/.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
